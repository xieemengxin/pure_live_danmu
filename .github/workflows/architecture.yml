name: 分层架构校验

on:
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'tool/validate_architecture.py'
      - '.github/workflows/architecture.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'tool/validate_architecture.py'
      - '.github/workflows/architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      # 3. 卡住新增的分层反向依赖。
      #    已批准的既有耦合登记在工具内的 BASELINE，只有新增项会让这一步失败。
      - name: Check layering
        run: python tool/validate_architecture.py --strict
